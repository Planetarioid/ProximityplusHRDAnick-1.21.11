name: Build plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ProximityplusHRDAnick-1.0.0
          path: target/ProximityplusHRDAnick-1.0.0.jar
